<meta charset="utf-8">
<title>Boldt Sales Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&display=swap">
<style>
/* Layout: navy masthead with filter, page tabs, then summary-first panels on a cool neutral ground. */
:root{
  --navy:#033D51; --navy-deep:#022E3D; --yellow:#EBBC4E; --gold:#D19000; --olive:#70924C; --green:#296C51; --slate:#57788F;
  --bg:#F2F4F5; --surface:#FFFFFF; --ink:#0F1C22; --muted:#5A6870; --line:#DCE1E4; --soft:#E9EDEF;
  --c-li:#033D51; --c-ga:#D19000; --c-hc:#033D51; --c-sl:#70924C; --c-budget:#9AA6AD; --mk-web:#4E9DBA; --mk-em:#B5547A;
  --good:#296C51; --warn:#B87A00; --bad:#B23B2A; --good-bg:#E3F0E9; --warn-bg:#FBF0D6; --bad-bg:#F8E3DF;
  --mast-ink:#FFFFFF;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif; --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A171D; --surface:#102229; --ink:#E7EDF0; --muted:#97A8B0; --line:#22404B; --soft:#16303A;
  --c-li:#62AFCB; --c-ga:#EBBC4E; --c-hc:#62AFCB; --c-sl:#9BBE72; --c-budget:#5E737D; --mk-web:#A8DCEE; --mk-em:#E58AAE;
  --good:#6CC096; --warn:#EBBC4E; --bad:#EE8773; --good-bg:#14352A; --warn-bg:#3A2F12; --bad-bg:#3C1E19;
  --navy:#04394B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A171D; --surface:#102229; --ink:#E7EDF0; --muted:#97A8B0; --line:#22404B; --soft:#16303A;
  --c-li:#62AFCB; --c-ga:#EBBC4E; --c-hc:#62AFCB; --c-sl:#9BBE72; --c-budget:#5E737D; --mk-web:#A8DCEE; --mk-em:#E58AAE;
  --good:#6CC096; --warn:#EBBC4E; --bad:#EE8773; --good-bg:#14352A; --warn-bg:#3A2F12; --bad-bg:#3C1E19;
  --navy:#04394B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
.wrap{max-width:1680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}

/* masthead */
.mast{background:var(--navy);color:var(--mast-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:3px solid var(--yellow)}
.mast .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:14px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{height:22px;width:auto;filter:invert(1)}
.brand h1{font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-stretch:90%;opacity:.92;white-space:nowrap}
.asof{font-size:12.5px;opacity:.75;margin-left:auto}
.month-pick{font:inherit;font-size:13px;font-weight:600;padding:5px 8px;border-radius:8px;border:0;background:rgba(255,255,255,.14);color:#fff}.month-pick option{color:#1B1B1B}
.scope{display:inline-flex;font-size:13px;font-weight:600;padding:6px 14px;border-radius:999px;background:var(--yellow);color:#1B1B1B}
.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + 63px);z-index:4}
.tabs .wrap{display:flex;gap:1px;overflow-x:auto;scrollbar-width:none}
.tabs a.cal-link{margin-left:auto;color:var(--ink)}
.tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);font-weight:600;font-size:13.5px;padding:12px 7px 10px;border-bottom:3px solid transparent}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--yellow)}
.tabs a:focus-visible{outline:2px solid var(--yellow);outline-offset:-2px}

main .wrap{padding-block:24px 56px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.page-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.page-head h2{font-size:clamp(26px,3.4vw,36px);font-weight:800;font-stretch:78%;letter-spacing:-.01em}
.page-head p{margin:0;color:var(--muted)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;min-width:0}
.panel h3{font-size:16px;font-weight:700;font-stretch:92%;margin-bottom:2px}
.panel .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.kpi{display:grid;gap:4px;align-content:start}
.kpi .v{font-family:var(--f-display);font-size:34px;line-height:1.05;font-weight:800;font-stretch:72%;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600}
.kpi .d{font-size:13px;color:var(--muted)}
.kpi .d b{font-weight:700}
.up{color:var(--good)} .dn{color:var(--bad)}
.bar{height:8px;background:var(--soft);border-radius:4px;position:relative;margin-top:6px;overflow:visible}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--c-hc)}
.bar>u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--muted);text-decoration:none}
.bar-labels{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--soft);color:var(--ink)}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.hc::before,.chip.sl::before,.chip.sh::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c-hc)}
.chip.sl::before{background:var(--c-sl)} .chip.sh::before{background:var(--c-budget)}

.flags{display:grid;gap:0;margin:0;padding:0;list-style:none}
.flags li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.flags li:first-child{border-top:0;padding-top:4px}
.flags .sev{grid-row:span 2;width:4px;border-radius:2px;background:var(--warn)}
.flags .sev.bad{background:var(--bad)} .flags .sev.good{background:var(--good)} .flags .sev.info{background:var(--slate)}
.flags b{font-weight:700}
.flags span{color:var(--muted);font-size:13.5px}

.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
th:first-child,td:first-child,td.l,th.l{text-align:left}
td.wrap-cell{white-space:normal;min-width:220px}
td.wrap-sm{white-space:normal;min-width:90px}
tr.total td{font-weight:700;border-bottom:0}
.util{display:inline-block;width:70px;height:6px;background:var(--soft);border-radius:3px;vertical-align:middle;margin-left:8px;position:relative}
.util i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--c-hc)}
.util i.over{background:var(--bad)}

.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .grid line{stroke:var(--line)}
.chart .axis{stroke:var(--line)}
.chart .lbl{fill:var(--ink);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend i.box{height:10px;width:10px}
.legend i.dash{background:transparent!important;border-top:2px dashed var(--muted);height:0}

.alert{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px 16px;border-radius:var(--r);background:var(--bad-bg);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent)}
.alert.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.alert.info{background:var(--soft);border-color:var(--line)}
.alert b{display:block;margin-bottom:2px}
.alert p{margin:0;font-size:14px}
.alert .dot{width:10px;height:10px;border-radius:50%;background:var(--bad);margin-top:6px}
.alert.warn .dot{background:var(--warn)} .alert.info .dot{background:var(--slate)}

.ads{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.ad{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;grid-template-rows:auto 1fr;min-width:0}
.ad .thumb{aspect-ratio:1/1;max-width:100%;background:var(--soft);display:grid;place-items:center;position:relative;overflow:hidden}
.ad .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ad .thumb .ph{font-family:var(--f-display);font-stretch:75%;font-weight:700;color:var(--muted);text-align:center;padding:16px;font-size:15px}
.ad .rank{position:absolute;top:8px;left:8px;background:var(--navy);color:#fff;font-weight:800;font-size:12px;border-radius:999px;padding:2px 9px}
.ad .rank.top{background:var(--yellow);color:#1B1B1B}
.ad .body{padding:12px 14px 14px;display:grid;gap:8px;align-content:start}
.ad .hl{font-weight:700;font-size:14px;line-height:1.3}
.ad .chips{display:flex;flex-wrap:wrap;gap:6px}
.ad dl{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0}
.ad dt{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.ad dd{margin:0;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.insights{margin:0;padding-left:18px;display:grid;gap:8px}
.insights li::marker{color:var(--gold)}
.list-2{columns:2 260px;column-gap:24px;margin:0;padding:0;list-style:none}
.list-2 li{break-inside:avoid;padding:6px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;font-size:14px}
.empty{padding:28px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);background:var(--surface)}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:20px}
.panel-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px 16px}
.sel{font-size:13px;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:8px}
.sel select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.ph-cell{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:0 6px}
.placeholder{border-style:dashed}
tr.future td{color:var(--muted)}
.hbars{display:grid;gap:7px;margin-top:6px}
/* grouped bars with hover (New MQLs by source) */
.gb{position:relative;margin-top:8px;padding-left:34px}
.gb-grid{position:absolute;inset:0 0 34px 34px;pointer-events:none}
.gb-grid span{position:absolute;left:0;right:0;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.gb-grid span b{position:absolute;left:-34px;top:-8px;width:28px;text-align:right;font-weight:500}
.gb-cols{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px;height:var(--h)}
.gb-m{position:relative;display:flex;flex-direction:column;justify-content:flex-end;border-radius:8px;cursor:default;outline:none;transition:background .2s}
.gb-bars{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;padding:0 3px}
.gb-bars i{flex:1;max-width:16px;border-radius:3px 3px 0 0;transform-origin:bottom;animation:gbGrow .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k)*45ms);transition:transform .2s,filter .2s,opacity .2s}
@keyframes gbGrow{from{transform:scaleY(0)}}
.gb-l{height:34px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);font-weight:600}
.gb-cols:hover .gb-m:not(:hover) .gb-bars i,.gb-cols:focus-within .gb-m:not(:focus) .gb-bars i{opacity:.35}
.gb-m:hover,.gb-m:focus{background:var(--soft)}
.gb-m:hover .gb-bars i,.gb-m:focus .gb-bars i{transform:scaleY(1.05);filter:saturate(1.15)}
.gb-m:hover .gb-l,.gb-m:focus .gb-l{color:var(--ink)}
.gb-tip{position:absolute;top:6px;left:calc(100% + 6px);min-width:180px;background:var(--ink);color:#fff;border-radius:8px;padding:9px 11px;font-size:12px;line-height:1.5;opacity:0;pointer-events:none;transform:translateX(-4px);transition:opacity .18s,transform .18s;z-index:5;box-shadow:0 8px 22px rgba(0,0,0,.18)}
.gb-m.gb-r .gb-tip{left:auto;right:calc(100% + 6px);transform:translateX(4px)}
.gb-tip b{display:block;font-size:12.5px;margin-bottom:3px}
.gb-tip span{display:flex;justify-content:space-between;gap:12px}
.gb-tip span i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.gb-tip em{display:block;font-style:normal;opacity:.75;margin-top:4px;max-width:200px}
.gb-m:hover .gb-tip,.gb-m:focus .gb-tip{opacity:1;transform:translateX(0)}
@media (prefers-reduced-motion:reduce){.gb-bars i{animation:none;transition:none}}
.sb .gb-bars i{display:none}
.sb-avg{position:absolute;left:34px;right:0;border-top:2px dashed var(--gold);z-index:2;pointer-events:none}.sb-avg span{position:absolute;right:0;top:-20px;font-size:11.5px;font-weight:700;color:var(--gold);background:var(--surface);padding:0 4px;border-radius:4px}
.sb-col{width:min(46px,62%);display:flex;flex-direction:column-reverse;border-radius:5px 5px 0 0;overflow:hidden;transform-origin:bottom;animation:gbGrow .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k)*45ms);transition:transform .2s,opacity .2s,filter .2s}
.sb-col b{display:block;transition:filter .2s}
.sb-col b+b{box-shadow:0 1px 0 rgba(255,255,255,.7)}
.sb-v{position:absolute;left:0;right:0;text-align:center;font-size:11.5px;font-weight:700;color:var(--ink);padding-bottom:3px}
.gb-cols:hover .gb-m:not(:hover) .sb-col,.gb-cols:focus-within .gb-m:not(:focus) .sb-col{opacity:.35}
.gb-m:hover .sb-col,.gb-m:focus .sb-col{transform:scaleY(1.03);filter:saturate(1.15)}
@media (prefers-reduced-motion:reduce){.sb-col{animation:none;transition:none}}

@media (max-width:700px){.gb-bars{gap:1px;padding:0 1px}.gb-cols{gap:2px}.gb-l{font-size:10.5px}}

.hb{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(60px,1fr) auto;gap:10px;align-items:center;font-size:13px}
.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:8px;background:var(--soft);border-radius:4px;position:relative}
.hb-t i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.pace{margin:10px 0 14px}
.pace-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:4px}
.pace-h span:first-child{display:inline-flex;gap:8px;align-items:center}
.bar>i.over{background:var(--bad)}
.eyebrow{margin-bottom:4px}
.method summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.method summary::-webkit-details-marker{display:none}
.method summary h3::before{content:"+ ";color:var(--gold)}
.method[open] summary h3::before{content:"– "}
.steps,.bp,.recs{margin:12px 0 0;padding-left:20px;display:grid;gap:10px}
.steps li::marker,.bp li::marker{color:var(--gold);font-weight:700}
.recs{list-style:none;padding:0}
.ex-head{justify-content:space-between;align-items:flex-end}
.ex-head .eyebrow{margin-bottom:4px}
.btn-print{font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.ex-doc{display:grid;gap:22px;padding:28px}
.ex-more{display:grid;gap:22px}
.ex-doc section{display:grid;gap:8px}
.ex-doc h3{font-size:17px}
.ex-doc p{margin:0;line-height:1.6}
.ex-lede{font-size:18px;line-height:1.55;font-weight:500}
.ex-list{margin:0;padding-left:20px;display:grid;gap:6px;line-height:1.55}
.page-head a{color:inherit;font-weight:600}
@media print{.mast,.tabs,footer,.btn-print,.narr{display:none!important}body{background:#fff}.panel{break-inside:avoid;border-color:#ccc}main .wrap{padding:0}}
.recs li{border-top:1px solid var(--line);padding-top:12px}
.recs li:first-child{border-top:0;padding-top:0}
.rec-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.recs p{margin:4px 0 2px;color:var(--ink)}
.q-pick{font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.q-lede{font-size:17px;line-height:1.55;font-weight:500;margin:0}
.q-take{border-left:4px solid var(--gold);background:var(--warn-bg)}
.q-take h3{color:var(--ink)}
.mix{display:flex;height:30px;border-radius:8px;overflow:hidden;margin:6px 0 4px;border:1px solid var(--line)}
.mix span{display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden}
.mix-row{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center}
.mix-row b{font-size:13px}
.rec-act{color:var(--ink)}
.rec-act b{color:var(--good)}
.sec-note{font-size:13px;color:var(--muted);margin:8px 0 0}
.sec-h{font-size:18px;margin:26px 0 2px}
.sec-sub{color:var(--muted);margin:0 0 12px;font-size:13.5px}
.dm-ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.dm-src{margin-top:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink);padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--navy);color:#fff}
.btn-sm{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer}
.btn-sm:hover{border-color:var(--ink)} .btn-sm.btn-brand{background:var(--gold);border-color:var(--gold);color:#03253A;font-weight:600}.btn-sm.btn-brand:hover{filter:brightness(.95);border-color:var(--gold)} .btn-sm.primary{background:var(--navy);border-color:var(--navy);color:#fff} .btn-sm.btn-open{background:var(--olive);border-color:var(--olive);color:#fff}.btn-sm.btn-open:hover{filter:brightness(.95);border-color:var(--olive)} .jr-task .tk-st{font-size:12px;margin:0}
.dm-task{margin-top:12px}
.dm-task-f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--soft);font-size:13px}
.dm-task-f label{display:flex;flex-direction:column;gap:3px} .dm-task-f .wide{grid-column:1/-1}
.jstrip.strip{display:block;grid-column:1/-1;margin-top:2px}.jstrip .cells i{height:16px}
.jstrip-ax.strip{display:grid;grid-template-columns:1fr;gap:2px;padding:0 13px}
.dm-task-f[hidden]{display:none!important}
.dm-task-f .dm-2nd{flex-direction:row;align-items:center;gap:8px;font-weight:600} .dm-task-f .dm-2nd input{width:auto;margin:0} .dm-task-f .dm-2nd-f[hidden]{display:none}

.jr-one{grid-template-columns:1fr!important}
.jm-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.jm-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:3px;margin-bottom:4px}

.jm ul li{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}

.jm-q{font-weight:600}

.strip-key{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 0 10px}

.stack{display:grid;gap:9px}
.stack .row{display:grid;grid-template-columns:minmax(160px,300px) 1fr 52px;gap:10px;align-items:center;font-size:13px}

.stack .sbar i{display:block;height:100%;flex:none}
.stack .v{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:700px){.stack .row{grid-template-columns:1fr 44px}.stack .row .t{grid-column:1/-1}}

@media (max-width:640px){.asof{margin-left:0;order:3}.scope{order:2;padding:3px 12px}.kpi .v{font-size:30px}.tabs{top:calc(env(safe-area-inset-top,0px) + 91px)}}

/* dashboard switch (Marketing | Sales) */
.dash-sw{display:inline-flex;border:1.5px solid rgba(255,255,255,.4);border-radius:999px;overflow:hidden;font-size:13px;font-weight:700}
.dash-sw a{padding:6px 14px;color:#fff;text-decoration:none;white-space:nowrap}
.dash-sw a[aria-current="page"]{background:var(--yellow);color:#1B1B1B}

tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.goal-in{font:inherit;font-size:15px;font-weight:700;width:104px;padding:6px 8px;text-align:right;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-variant-numeric:tabular-nums}
.goal-in:focus{outline:2px solid var(--yellow);border-color:var(--gold)}
.panel>.g-kpi>.kpi{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}

@media print{.dash-sw{display:none}}

<header class="mast">
  <div class="wrap">
    <div class="brand"><img src="boldt-logo.png" alt="Boldt"><h1>Sales Dashboard</h1></div>
    <nav class="dash-sw" aria-label="Dashboard"><a href="index.html#exec">Marketing</a><a href="sales.html" aria-current="page">Sales</a></nav>
    <span class="scope">Healthcare</span>
    <div class="asof" id="asof"></div>
  </div>
</header>
<nav class="tabs" aria-label="Pages"><div class="wrap" id="tabs"></div></nav>
<main><div class="wrap" id="view"><div class="empty">Loading sales activity from HubSpot…</div></div></main>
<footer><div class="wrap" id="foot"></div></footer>

<script>
(function(){
try{sessionStorage.setItem("bmd_dash","sales");}catch(e){}
const HS_PORTAL="4587932";
const MONTHS_LONG=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
let S=null, ERR="", TRIES=0, SEL="", TEXT={}, TXT_MONTHS=[], VIEWREP="team", SUMREP="team", GOALS=null, GOALS_ERR="";
let LT=null, LT_ERR="", LT_TRY=0;

/* ---------- formatting (same helpers as the marketing dashboard) ---------- */
const $=(n,dp=0)=>"$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:dp,maximumFractionDigits:dp});
const $k=n=>Math.abs(n)>=1e6?"$"+(n/1e6).toFixed(n>=1e8?0:1)+"M":Math.abs(n)>=10000?"$"+(n/1000).toFixed(n>=100000?0:1)+"K":$(n);
const N=(n,dp=0)=>Number(n).toLocaleString("en-US",{minimumFractionDigits:dp,maximumFractionDigits:dp});
const P=(n,dp=1)=>(n*100).toFixed(dp)+"%";
const sum=a=>a.reduce((s,x)=>s+(x||0),0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const plw=(n,w)=>`${N(n)} ${w}${n===1?"":"s"}`;
const fdShort=iso=>{const d=String(iso||"").split("-");return d.length===3?`${MS[+d[1]-1]} ${+d[2]}`:"";};
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}
function ticks(max){for(const n of [5,4]){const s=max/n,p=Math.pow(10,Math.floor(Math.log10(s))),m=s/p;if([1,2,2.5,5,10].some(x=>Math.abs(m-x)<1e-9))return n;}return 4;}
function gbars({labels,series,h=220,totals=null,totalLabel="Team",note=""}){
  const mx=niceMax(Math.max(1,...series.flatMap(s=>s.values))*1.05), nt=ticks(mx);
  const grid=Array.from({length:nt+1},(_,k)=>`<span style="bottom:${(k/nt*100).toFixed(2)}%"><b>${N(mx*k/nt)}</b></span>`).join("");
  return `<div class="gb" style="--h:${h}px"><div class="gb-grid">${grid}</div><div class="gb-cols" style="--n:${labels.length}">${labels.map((lb,i)=>`<div class="gb-m${i>=labels.length/2?" gb-r":""}" tabindex="0" aria-label="${esc(lb)}: ${series.map(s=>`${s.name} ${s.values[i]||0}`).join(", ")}">
    <div class="gb-tip"><b>${esc(lb)}${totals?` · ${totalLabel} ${N(totals[i])}`:""}</b>${series.map(s=>`<span><span><i style="background:${s.color}"></i>${esc(s.name)}</span>${N(s.values[i]||0)}</span>`).join("")}${note?`<em>${esc(note)}</em>`:""}</div>
    <div class="gb-bars">${series.map(s=>`<i style="height:${((s.values[i]||0)/mx*100).toFixed(2)}%;background:${s.color};--k:${i}"></i>`).join("")}</div><div class="gb-l">${esc(lb)}</div></div>`).join("")}</div></div>`;}
// One stacked bar per month, split by type; hover or focus a month for its numbers.
function sbars({labels,series,h=240,totalLabel="Total"}){
  const totals=labels.map((_,i)=>sum(series.map(s=>s.values[i]||0))), mx=niceMax(Math.max(1,...totals)*1.12), nt=ticks(mx);
  const grid=Array.from({length:nt+1},(_,k)=>`<span style="bottom:${(k/nt*100).toFixed(2)}%"><b>${N(mx*k/nt)}</b></span>`).join("");
  return `<div class="gb sb" style="--h:${h}px"><div class="gb-grid">${grid}</div><div class="gb-cols" style="--n:${labels.length}">${labels.map((lb,i)=>{
    const t=totals[i], hp=t/mx*100;
    const segs=series.map(s=>[s,(s.values[i]||0)]).filter(x=>x[1]).map(([s,v])=>`<b style="flex:${v};background:${s.color}" title="${esc(s.name)}: ${N(v)}"></b>`).join("");
    return `<div class="gb-m${i>=labels.length/2?" gb-r":""}" tabindex="0" aria-label="${esc(lb)}: ${totalLabel} ${N(t)}; ${series.map(s=>`${s.name} ${s.values[i]||0}`).join(", ")}">
    <div class="gb-tip"><b>${esc(lb)} · ${totalLabel} ${N(t)}</b>${series.map(s=>`<span><span><i style="background:${s.color}"></i>${esc(s.name)}</span>${N(s.values[i]||0)}</span>`).join("")}</div>
    <div class="gb-bars" style="position:relative">${t?`<div class="sb-col" style="height:${hp.toFixed(2)}%;--k:${i}">${segs}</div><span class="sb-v" style="bottom:${hp.toFixed(2)}%">${N(t)}</span>`:""}</div><div class="gb-l">${esc(lb)}</div></div>`;}).join("")}</div></div>`;}
const legend=items=>`<div class="legend">${items.map(i=>`<span><i class="box" style="background:${i.color}"></i>${esc(i.name)}</span>`).join("")}</div>`;
function head(title,sub){return `<div class="page-head"><h2>${title}</h2><p>${sub}</p></div>`;}
function kpi(l,v,d=""){return `<div class="panel kpi"><div class="l">${l}</div><div class="v num">${v}</div>${d?`<div class="d">${d}</div>`:""}</div>`;}
function hbars(items,{fmt=N,color=css("--c-hc")}={}){const mx=Math.max(...items.map(i=>i.v),1);
  return `<div class="hbars">${items.map(i=>`<div class="hb"><span class="hb-l">${esc(i.k)}</span><span class="hb-t"><i style="width:${i.v/mx*100}%;background:${i.color||color}"></i></span><b class="num">${fmt(i.v)}</b></div>`).join("")}</div>`;}

/* ---------- data helpers ---------- */
const REPC=()=>[css("--c-li"),css("--c-ga"),css("--c-sl"),css("--slate")];
const repColor=i=>REPC()[i%4];
const first=n=>String(n).split(" ")[0];
const mLong=ym=>`${MONTHS_LONG[+ym.slice(5,7)-1]}`;
const mShort=ym=>MS[+ym.slice(5,7)-1];
const curYM=()=>S.today.slice(0,7);
const isCur=ym=>ym===curYM();
const sofar=ym=>isCur(ym)?" so far":"";
const prevYM=ym=>{const i=S.months.indexOf(ym);return i>0?S.months[i-1]:"";};
const A=(ym,id)=>(S.activity[ym]||{})[id]||null;
const val=(ym,id,k)=>{const a=A(ym,id);return a?a[k]||0:0;};
const team=(ym,k)=>sum(S.reps.map(r=>val(ym,r.id,k)));
const has=ym=>!!S.activity[ym];
const ytdMonths=()=>S.months.filter(m=>m<=SEL&&has(m));
const ytd=(k,id)=>sum(ytdMonths().map(m=>id?val(m,id,k):team(m,k)));
const ytdLabel=()=>{const ms=ytdMonths();return ms.length?`Jan to ${mShort(ms[ms.length-1])}`:"";};
/* goals: a month without its own goals uses the most recent earlier month that has them */
const GM=[["calls","Calls"],["emails","1:1 emails sent"],["held","Meetings held"],["tasksDone","Tasks completed"]];
function goalMonth(ym){if(!GOALS)return "";const ks=Object.keys(GOALS).filter(k=>/^\d{4}-\d{2}$/.test(k)&&k<=ym).sort();return ks.length?ks[ks.length-1]:"";}
const goal=(ym,id,k)=>{const g=goalMonth(ym);const v=g?((GOALS[g]||{})[id]||{})[k]:null;return v==null?null:v;};
const teamGoal=(ym,k)=>{const v=S.reps.map(r=>goal(ym,r.id,k));return v.some(x=>x==null)?null:sum(v);};   /* a team goal only when every rep has one */
function pctChip(a,g){if(g==null)return "";if(!g)return "";const p=a/g;return ` <span class="chip ${p>=1?"good":p>=.7?"warn":""}">${P(p,0)}</span>`;}
const vsGoal=(a,g)=>g==null?N(a):`${N(a)} <span class="note" style="margin:0">of ${N(g)}</span>${pctChip(a,g)}`;
function goalsPanel(m){if(!GOALS||!goalMonth(m)||!GM.some(([k])=>S.reps.some(r=>goal(m,r.id,k)!=null)))return "";
  return `<div class="panel"><h3>Progress against goals, ${mLong(m)}${sofar(m)}</h3><p class="sub">Actual of goal, by rep. <a href="#goals">Set or change goals</a></p>${repTable(GM.map(x=>x[1]),
    r=>GM.map(([k])=>vsGoal(val(m,r.id,k),goal(m,r.id,k))),()=>GM.map(([k])=>vsGoal(team(m,k),teamGoal(m,k))))}</div>`;}
const touches=(ym,id)=>val(ym,id,"calls")+val(ym,id,"emails")+val(ym,id,"held");
// Change against the month before. Left out for the month in progress, where a partial month would read as a drop.
function delta(ym,k,upGood=true){const p=prevYM(ym);if(!p||!has(p)||isCur(ym))return p&&has(p)?`${mLong(p)}: ${N(team(p,k))}`:"";
  const a=team(ym,k),b=team(p,k);if(!b)return `${mLong(p)}: ${N(b)}`;const c=(a-b)/b;
  return `${mLong(p)}: ${N(b)} · <span class="${Math.abs(c)<.005?"":(c>=0)===upGood?"up":"dn"}">${c>=0?"+":""}${P(c,0)}</span>`;}
const repCell=(r,i)=>`<td class="l"><i class="rep-dot" style="background:${repColor(i)}"></i><b>${esc(r.name)}</b></td>`;
const rate=(a,b)=>b?P(a/b,0):"–";
function repTable(cols,rowFn,totFn){
  return `<div class="tbl-wrap"><table><thead><tr><th class="l">Rep</th>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${S.reps.map((r,i)=>`<tr>${repCell(r,i)}${rowFn(r).map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}<tr class="tot"><td class="l">Team total</td>${totFn().map(v=>`<td>${v}</td>`).join("")}</tr></tbody></table></div>`;}
const byRepSeries=k=>S.reps.map((r,i)=>({name:r.name,color:repColor(i),values:S.months.map(m=>typeof k==="function"?k(m,r.id):val(m,r.id,k))}));
const monthChart=(title,sub,k,note="")=>{const ser=byRepSeries(k);
  return `<div class="panel"><h3>${title}</h3><p class="sub">${sub}</p>${legend(ser)}${gbars({labels:S.months.map(mShort),series:ser,totals:S.months.map((m,i)=>sum(ser.map(s=>s.values[i])))})}${note||isCur(S.months[S.months.length-1])?`<p class="note">${note?note+" ":""}${mLong(S.months[S.months.length-1])} is month to date.</p>`:""}</div>`;};

/* ---------- pages ---------- */
const R={};
function narrativePanel(){const T=TEXT[SEL];if(!T)return "";
  let h=T.headline?`<div class="panel"><p class="q-lede">${esc(T.headline)}</p></div>`:"";
  const list=(t,a,sev)=>a&&a.length?`<div class="panel"><h3>${t}</h3><ul class="flags">${a.map(x=>`<li><i class="sev ${sev}"></i><b>${esc(x[0])}</b><span>${esc(x[1])}</span></li>`).join("")}</ul></div>`:"";
  const two=list("What went well",T.wins,"good")+list("Where we are focused",T.focus,"warn");
  return h+(two?`<div class="grid g-2">${two}</div>`:"");}
function ltMedian(){if(!LT)return null;const T=LT.tasks.filter(t=>t.c&&t.a&&t.a>=t.c).map(t=>(t.a-t.c)/36e5);return ltMed(T);}

R.summary=()=>{const m=SEL, mn=mLong(m);
  let h=head("Sales Summary",`Healthcare sales activity for ${mn} 2026${sofar(m)}: calls, 1:1 emails, meetings, follow-up and pipeline for ${S.reps.map(r=>r.name).join(" and ")}.`);
  h+=narrativePanel();
  const tk=S.tasks, od=tk?sum(S.reps.map(r=>tk.byRep[r.id].overdue)):null, op=tk?sum(S.reps.map(r=>tk.byRep[r.id].open)):null;
  const med=ltMedian(), pl=S.pipeline&&S.pipeline.ready?S.pipeline:null;
  h+=`<div class="grid g-kpi">${kpi(`Calls, ${mn}${sofar(m)}`,N(team(m,"calls")),delta(m,"calls"))}
    ${kpi(`1:1 emails sent, ${mn}${sofar(m)}`,N(team(m,"emails")),delta(m,"emails"))}
    ${kpi(`Meetings held, ${mn}${sofar(m)}`,N(team(m,"held")),delta(m,"held"))}
    ${kpi("Median speed to lead",LT?ltDur(med):"–",LT?`MQL follow-up tasks since ${fdShort(new Date(LT.since).toISOString().slice(0,10))}. <a href="#speed">See detail</a>`:"Loading from HubSpot")}
    ${kpi("All open tasks now",op==null?"–":N(op),od==null?"":`${N(od)} overdue. <a href="#tasks">See detail</a>`)}
    ${pl?kpi("Open deals now",N(pl.open.length),`${plw(pl.monthly[m]?pl.monthly[m].created:0,"new deal")} in ${mn}. <a href="#pipeline">See detail</a>`):""}</div>`;
  h+=`<div class="panel"><h3>By rep, ${mn}${sofar(m)}</h3><p class="sub">Activity logged in HubSpot, with the team total</p>${repTable(
    ["Calls","1:1 emails sent","Replies received","Meetings held","Tasks completed","Days active","All open tasks now","All overdue now"],
    r=>[N(val(m,r.id,"calls")),N(val(m,r.id,"emails")),N(val(m,r.id,"replies")),N(val(m,r.id,"held")),N(val(m,r.id,"tasksDone")),N(val(m,r.id,"days")),tk?N(tk.byRep[r.id].open):"–",tk?N(tk.byRep[r.id].overdue):"–"],
    ()=>[N(team(m,"calls")),N(team(m,"emails")),N(team(m,"replies")),N(team(m,"held")),N(team(m,"tasksDone")),"",op==null?"–":N(op),od==null?"–":N(od)])}
    <p class="sec-note">Days active counts days with at least one call, 1:1 email or meeting held.</p></div>`;
  h+=goalsPanel(m);
  const yl=ytdLabel(), plY=k=>pl?sum(ytdMonths().map(x=>(pl.monthly[x]||{})[k]||0)):null;
  h+=`<div class="panel"><h3>Year to date, ${yl} 2026</h3><p class="sub">Team totals, then by rep</p>
    <div class="grid g-kpi" style="margin-bottom:14px">${[["Calls","calls"],["1:1 emails sent","emails"],["Meetings held","held"],["Tasks completed","tasksDone"]].map(([l,k])=>`<div class="kpi"><div class="l">${l}</div><div class="v num">${N(ytd(k))}</div><div class="d">${N(ytd(k)/Math.max(ytdMonths().length,1))} a month on average</div></div>`).join("")}
    ${pl?`<div class="kpi"><div class="l">New deals</div><div class="v num">${N(plY("created"))}</div><div class="d">${N(plY("won"))} won · ${N(plY("lost"))} closed lost</div></div>`:""}</div>
    ${repTable(["Calls","Calls connected","1:1 emails sent","Replies received","Meetings held","Tasks completed","Days active"],
      r=>["calls","connected","emails","replies","held","tasksDone","days"].map(k=>N(ytd(k,r.id))),
      ()=>["calls","connected","emails","replies","held","tasksDone"].map(k=>N(ytd(k))).concat([""]))}</div>`;
  const who=SUMREP==="team"?null:SUMREP, g=(x,k)=>who?val(x,who,k):team(x,k);
  const ser=[{name:"Calls",color:css("--c-li"),values:S.months.map(x=>g(x,"calls"))},{name:"1:1 emails sent",color:css("--c-ga"),values:S.months.map(x=>g(x,"emails"))},{name:"Meetings held",color:css("--c-sl"),values:S.months.map(x=>g(x,"held"))}];
  h+=`<div class="panel"><div class="lt-h"><h3>Sales activity by month, by type</h3><div class="seg" role="group" aria-label="Show">${[["team","Team total"],...S.reps.map(r=>[r.id,r.name])].map(([id,n])=>`<button type="button" data-sumrep="${esc(id)}" class="${SUMREP===id?"on":""}">${esc(n)}</button>`).join("")}</div></div>
    <p class="sub">Calls, 1:1 emails sent and meetings held each month. Hover a month for the counts.</p>${legend(ser)}${sbars({labels:S.months.map(mShort),series:ser})}
    <p class="note">${mLong(S.months[S.months.length-1])} is month to date.</p></div>`;
  return h;};

R.emails=()=>{const m=SEL, mn=mLong(m), E=S.email||{}, e=team(m,"emails");
  let h=head("1:1 Email Performance",`How the team's 1:1 sales emails perform: opens, clicks and replies by rep, by subject line and by subject line style.`);
  const tr=E.trackedOk, r3=(a,b)=>b?P(a/b,0):"–";
  h+=`<div class="grid g-kpi">${kpi(`1:1 emails sent, ${mn}${sofar(m)}`,N(e),delta(m,"emails"))}
    ${tr?kpi("Opened",r3(team(m,"eOpen"),e),`${N(team(m,"eOpen"))} emails opened at least once`):""}${tr?kpi("Clicked",r3(team(m,"eClick"),e),`${N(team(m,"eClick"))} emails with a link click`):""}
    ${tr?kpi("Replied",r3(team(m,"eReply"),e),`${N(team(m,"eReply"))} emails that got a reply`):""}
    ${kpi("New conversations",N(team(m,"eNew")),`${N(team(m,"eThread"))} more were replies or forwards in a thread`)}</div>`;
  h+=`<div class="panel"><h3>By rep</h3><p class="sub">${mn}${sofar(m)}, then year to date (${ytdLabel()})</p>${repTable(
    [`Sent, ${mShort(m)}`,...(tr?["Open rate","Click rate","Reply rate"]:[]),"Sent, year to date",...(tr?["Open rate, YTD","Click rate, YTD","Reply rate, YTD"]:[])],
    r=>{const g=k=>val(m,r.id,k),y=k=>ytd(k,r.id);return [N(g("emails")),...(tr?[r3(g("eOpen"),g("emails")),r3(g("eClick"),g("emails")),r3(g("eReply"),g("emails"))]:[]),N(y("emails")),...(tr?[r3(y("eOpen"),y("emails")),r3(y("eClick"),y("emails")),r3(y("eReply"),y("emails"))]:[])];},
    ()=>[N(e),...(tr?[r3(team(m,"eOpen"),e),r3(team(m,"eClick"),e),r3(team(m,"eReply"),e)]:[]),N(ytd("emails")),...(tr?[r3(ytd("eOpen"),ytd("emails")),r3(ytd("eClick"),ytd("emails")),r3(ytd("eReply"),ytd("emails"))]:[])])}</div>`;
  if(!E.subjectsOk) return h+`<div class="empty">Subject line results will show here once subject lines are available to the dashboard.</div>`;
  const T=E.traits||{}, groups=[["len","Length"],["q","Question or statement"],["num","Number in the subject"],["boldt","Names Boldt"],["you","Speaks to the reader"]];

  const lift=(a,n,ba,bn)=>{if(!n||!bn||!ba)return "";const d=a/n-ba/bn;return Math.abs(d)<.005?"":` <span class="${d>0?"up":"dn"}">${d>0?"+":""}${(d*100).toFixed(0)} pts</span>`;};
  h+=`<div class="panel"><h3>What kind of subject line works, year to date</h3><p class="sub">New 1:1 emails only (replies and forwards left out). ${tr?`All subject lines: ${r3(baseO,base)} opened, ${r3(baseR,base)} replied. Points show the gap to that average.`:""}</p>

    <p class="sec-note">Opens, clicks and replies count emails with at least one. Opens rely on tracking in the email, so some real opens are not counted. Subject lines used once or twice are left out of this list and counted in the style table above.</p></div>`;
  return h;};

R.goals=()=>{const m=SEL, mn=mLong(m);

function saveGoal(inp){const [rep,metric]=inp.dataset.goal.split("|"), st=document.getElementById("goal-st"), cur=goal(SEL,rep,metric), v=inp.value.trim();
  if((v===""&&(cur==null||!GOALS[SEL]))||(v!==""&&GOALS[SEL]&&Number(v)===cur))return;
  if(st)st.textContent="Saving…";
  /* the first change to a month that was carried forward copies the carried goals in, so the other numbers stay as shown */
  const gm=goalMonth(SEL), posts=[];
  if(!GOALS[SEL]&&gm) S.reps.forEach(r=>GM.forEach(([k])=>{const g=goal(SEL,r.id,k);if(g!=null&&!(r.id===rep&&k===metric))posts.push({month:SEL,rep:r.id,metric:k,value:g});}));
  posts.push({month:SEL,rep,metric,value:v===""?null:Number(v)});
  posts.reduce((p,b)=>p.then(()=>fetch("/api/sales-goals",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)}).then(r=>r.json()).then(j=>{if(!j.ok)throw new Error(j.error||"");GOALS=j.goals;})),Promise.resolve())
    .then(()=>{render.force=true;render(true);render.force=false;}).catch(e=>{if(st)st.textContent=`That didn't save${e&&e.message?` (${e.message})`:""}. Try again.`;});}
function loadGoals(){fetch("/api/sales-goals",{cache:"no-store"}).then(r=>r.json()).then(j=>{if(!j.ok)throw 0;GOALS=j.goals||{};GOALS_ERR="";}).catch(()=>{GOALS_ERR="Goals aren't available right now. Refresh to try again.";}).then(()=>{if(S)render(true);});}

/* Speed to lead: the same MQL follow-up section as the marketing dashboard's Leads page (hs-leadtasks). */
function ltLoad(fresh){fetch(`/api/hs-leadtasks${fresh?"?fresh=1":""}`).then(r=>r.json()).then(j=>{
    if(!j.ready){LT_ERR="This turns on when HubSpot is connected.";} else if(!j.ok){LT_ERR=j.error||"Couldn't read follow-up tasks from HubSpot.";} else {LT=j;LT_ERR="";}
    if(LT&&LT.scan&&!LT.scan.complete&&LT_TRY<20){LT_TRY++;setTimeout(()=>ltLoad(),2500);}
  }).catch(()=>{LT_ERR="Couldn't load follow-up tasks. Refresh to try again.";}).then(()=>{if(S)render(true);});}
const ltDur=h=>h==null?"–":h<1?"Under 1 hour":h<48?plw(Math.round(h),"hour"):plw(Math.round(h/24),"day");
const ltMed=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),k=Math.floor(s.length/2);return s.length%2?s[k]:(s[k-1]+s[k])/2;};
const ltDay=t=>new Intl.DateTimeFormat("en-CA",{timeZone:"America/Chicago",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(t));
const coName=(n,id)=>id?`<a class="co-link" href="https://app.hubspot.com/contacts/${HS_PORTAL}/record/0-2/${esc(String(id))}" target="_blank" rel="noopener" title="Open ${esc(n)} in HubSpot"><b>${esc(n)}</b></a>`:`<b>${esc(n)}</b>`;
function ltBody(){
  const hd=`<h3>MQL follow-up</h3><p class="sub">"Marketing lead #1" tasks assigned to Chris White in HubSpot. Speed to lead is the time from when the task is created to when it's completed or deleted (deleted when the lead isn't relevant).</p>`;
  if(LT_ERR)return hd+`<p class="note">${esc(LT_ERR)}</p>`;
  if(!LT)return hd+`<p class="note">Loading follow-up tasks from HubSpot…</p>`;
  const T=LT.tasks.filter(t=>t.c), now=LT.asOf, H=t=>(t.a-t.c)/36e5;
  const acted=T.filter(t=>t.a&&t.a>=t.c), done=acted.filter(t=>t.k==="done"), del=acted.filter(t=>t.k==="del"), open=T.filter(t=>!t.a);
  const med=ltMed(acted.map(H)), coh=T.filter(t=>now-t.c>=7*864e5);
  const within=d=>coh.length?coh.filter(t=>t.a&&t.a>=t.c&&H(t)<=d*24).length/coh.length:null;
  const since=fdShort(new Date(LT.since).toISOString().slice(0,10));
  let h=hd+`<div class="grid g-kpi">${kpi("Overdue now",N(LT.overdue.length),"Not started and past the due date")}
    ${kpi("Median speed to lead",ltDur(med),`Across ${plw(acted.length,"task")} completed or deleted since ${since}`)}
    ${kpi("Handled within 1 day",within(1)==null?"–":P(within(1),0),`Within 3 days: ${within(3)==null?"–":P(within(3),0)} · within 7 days: ${within(7)==null?"–":P(within(7),0)}`)}
    ${kpi("Completed vs deleted, year to date",`${N(done.length)} <small>/ ${N(del.length)}</small>`,`${N(open.length)} still open. Tasks created since ${since}`)}</div>`;
  const O=LT.overdue;
  h+=`<h4 style="margin:16px 0 6px">Overdue MQL follow-up tasks (${N(O.length)})</h4>`;
  h+=O.length?`<div class="tbl-wrap"><table><thead><tr><th class="l">Company</th><th class="l">Due</th><th>Days overdue</th><th class="l">Task created</th></tr></thead><tbody>${O.map(o=>`<tr><td class="l wrap-cell">${o.companyId?coName(o.company||o.domain||"Company record",o.companyId):'<span class="note" style="margin:0">No company linked</span>'}</td><td class="l">${fdShort(ltDay(o.due))}</td><td>${N(Math.max(1,Math.floor((now-o.due)/864e5)))}</td><td class="l">${fdShort(ltDay(o.created))}</td></tr>`).join("")}</tbody></table></div>`
    :`<p class="note">No overdue MQL follow-up tasks.</p>`;
  h+=`<p class="sec-note">Same filters as the HubSpot report: assigned to Chris White, title contains "marketing lead #1", status not in progress, completed, waiting or deferred, and past due. Speed to lead counts calendar time, including nights and weekends. "Handled within" figures are out of tasks created at least 7 days ago.${LT.scan&&!LT.scan.complete?" Deleted tasks are still being counted; this updates on its own in a moment.":""}</p>`;
  return h;}

  const who=VIEWREP==="team"?null:VIEWREP, g=(m,k)=>who?val(m,who,k):team(m,k);
  let h=head("Month Over Month","Every sales metric by month for 2026.");
  h+=`<div class="seg" role="group" aria-label="Show">${[["team","Team total"],...S.reps.map(r=>[r.id,r.name])].map(([id,n])=>`<button type="button" data-rep="${esc(id)}" class="${VIEWREP===id?"on":""}">${esc(n)}</button>`).join("")}</div>`;
  const rows=[["Calls","calls"],["Calls connected","connected"],["Minutes on calls","callMin"],["1:1 emails sent","emails"],["Replies received","replies"],["Meetings held","held"],["Meeting no-shows","noShow"],["Tasks created","tasksNew"],["Tasks completed","tasksDone"]];
  if(who) rows.push(["Days active","days"]);
  const cell=(m,v)=>has(m)?N(v):"–";
  let body=rows.map(([l,k])=>`<tr><td>${l}</td>${ms.map(m=>`<td>${cell(m,g(m,k))}</td>`).join("")}<td><b>${N(sum(ms.map(m=>g(m,k))))}</b></td></tr>`).join("");
  if(pl&&!who) body+=[["New deals","created"],["Deals won","won"],["Deals closed lost","lost"]].map(([l,k])=>`<tr><td>${l}</td>${ms.map(m=>`<td>${N((pl.monthly[m]||{})[k]||0)}</td>`).join("")}<td><b>${N(sum(ms.map(m=>(pl.monthly[m]||{})[k]||0)))}</b></td></tr>`).join("");
  h+=`<div class="panel"><h3>${who?esc(S.reps.find(r=>r.id===who).name):"Team total"}, 2026</h3><div class="tbl-wrap"><table class="mom"><thead><tr><th class="l">Metric</th>${ms.map(m=>`<th>${mShort(m)}${isCur(m)?"*":""}</th>`).join("")}<th>Year to date</th></tr></thead><tbody>${body}</tbody></table></div>
    <p class="note">* ${mLong(ms[ms.length-1])} is month to date.</p></div>`;
  h+=`<div class="grid g-2">${monthChart("Sales touches by month","Calls, 1:1 emails sent and meetings held, by rep",touches)}${monthChart("Tasks completed by month","By rep","tasksDone")}</div>`;
  return h;};

R.recs=()=>{const T=TEXT[SEL]||{}, RC=T.recs||[];
  let h=head("Recommendations",`Next steps from ${mLong(SEL)}'s sales numbers.`);
  if(!RC.length) return h+`<div class="empty">Recommendations are written with each monthly report on the 1st.</div>`;
  return h+`<div class="panel"><ol class="recs">${RC.map(r=>`<li><div class="rec-h"><span class="chip ${r.pri==="High"?"bad":r.pri==="Medium"?"warn":""}">${esc(r.pri)}</span><b>${esc(r.title)}</b></div><p>${esc(r.detail)}</p><span class="note">Owner: ${esc(r.owner)}</span></li>`).join("")}</ol></div>`;};

/* ---------- shell ---------- */
const PAGES=()=>[["summary","Summary"],["activity","Activity"],["emails","1:1 Emails"],["speed","Speed To Lead"],["tasks","All Tasks"],["pipeline","Pipeline"],["trends","Month Over Month"],["goals","Goals"],...(TXT_MONTHS.length?[["recs","Recommendations"]]:[])];
const asOfLabel=()=>new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}).format(new Date(S.asOf))+" CT";
function current(){const h=(location.hash||"").slice(1).split("/")[0];return PAGES().some(p=>p[0]===h)?h:"summary";}
function render(keep){
  const v=document.getElementById("view");
  if(ERR&&!S){v.innerHTML=`<div class="empty">${esc(ERR)}</div>`;return;}
  if(!S)return;
  const pg=current(), y=scrollY;
  if(keep&&document.activeElement&&document.activeElement.classList&&document.activeElement.classList.contains("goal-in")&&pg==="goals"&&!render.force)return;
  document.getElementById("tabs").innerHTML=PAGES().map(([id,n])=>`<a href="#${id}" ${id===pg?'aria-current="page"':''}>${n}</a>`).join("");
  let html=has(SEL)||pg==="speed"?R[pg]():`<div class="empty">Loading ${mLong(SEL)} from HubSpot…</div>`;
  if(S.partial) html+=`<p class="note" aria-live="polite">Still loading the rest of the year from HubSpot. This fills in on its own.</p>`;
  if(HEALTH&&S.health&&S.health.length) html+=`<div class="panel"><h3>Data health (Amy only)</h3><ul>${S.health.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`;
  v.innerHTML=html;
  document.querySelectorAll("[data-sumrep]").forEach(b=>b.addEventListener("click",()=>{SUMREP=b.dataset.sumrep;render(true);}));
  document.querySelectorAll("[data-goal]").forEach(i=>i.addEventListener("change",()=>saveGoal(i)));
  document.querySelectorAll("[data-rep]").forEach(b=>b.addEventListener("click",()=>{VIEWREP=b.dataset.rep;render(true);}));
  document.getElementById("asof").textContent=`Live from HubSpot · ${asOfLabel()}`;
  if(keep)scrollTo(0,y);
  const t=document.querySelector('.tabs a[aria-current="page"]'); if(t&&t.scrollIntoView) t.scrollIntoView({block:"nearest",inline:"nearest"});
}
const HEALTH=/[?&]health=1/.test(location.search);
addEventListener("hashchange",()=>{render();scrollTo(0,0);});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>render(true));
function picker(){if(document.getElementById("mpick")||!S)return;const sel=document.createElement("select");sel.id="mpick";sel.className="month-pick";sel.setAttribute("aria-label","Report month");
  sel.innerHTML=[...S.months].reverse().map(m=>`<option value="${m}" ${m===SEL?"selected":""}>${mLong(m)} ${m.slice(0,4)}${isCur(m)?" (so far)":""}</option>`).join("");
  sel.addEventListener("change",()=>{SEL=sel.value;loadText(SEL);render(true);});document.getElementById("asof").after(sel);}
function loadText(m){if(TEXT[m]!==undefined||!TXT_MONTHS.includes(m))return;TEXT[m]=null;
  fetch(`data/sales-${m}.json`,{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{TEXT[m]=j;if(m===SEL)render(true);}).catch(()=>{});}
function load(fresh){fetch(`/api/hs-sales${fresh?"?fresh=1":""}`,{cache:"no-store"}).then(r=>r.json()).then(j=>{
    if(j.ready===false){ERR="This dashboard turns on when HubSpot is connected.";}
    else if(!j.ok){ERR=j.error==="signed out"?"Your session ended. Refresh the page to sign in again.":"Sales activity didn't load from HubSpot. Refresh to try again.";}
    else{S=j;ERR="";
      if(!SEL){const done=S.months.filter(m=>!isCur(m));SEL=done.length?done[done.length-1]:S.months[S.months.length-1];}   /* open on the last complete month, like the marketing report */
      picker();loadText(SEL);
      if(S.partial&&TRIES<30){TRIES++;setTimeout(()=>load(),2000);}}
  }).catch(()=>{if(!S)ERR="Sales activity didn't load. Refresh to try again.";}).then(()=>render(true));}
document.getElementById("foot").textContent="Source: HubSpot (calls, 1:1 emails, meetings, tasks and deals owned by the healthcare sales team). Numbers are live and update as activity is logged.";
fetch("data/sales-index.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(j=>{TXT_MONTHS=(j&&j.months)||[];if(S){loadText(SEL);render(true);}}).catch(()=>{});
load(); ltLoad(); loadGoals();
})();
</script>
